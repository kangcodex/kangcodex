name: Update stats cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The default GITHUB_TOKEN cannot render the stats card: github-readme-stats
      # queries user-level GraphQL, and an Actions token is rejected with
      # "Resource not accessible by integration". No PAT secret exists in this
      # repo (github-readme-stats also hard-requires at least one PAT_1..N env
      # var), so render via the official github-readme-stats deployment instead.
      - name: Generate stats card
        run: |
          TMP_SVG=$(mktemp profile/stats.svg.XXXXXX)
          ok=false
          for attempt in 1 2 3; do
            HTTP_CODE=$(curl -sS --connect-timeout 10 --max-time 120 -o "$TMP_SVG" -w '%{http_code}' "https://github-readme-stats.vercel.app/api?username=kangcodex&show_icons=true&theme=tokyonight&hide_border=true&include_all_commits=true" || true)
            if [ "$HTTP_CODE" = "200" ] && python3 .github/scripts/validate-svg.py "$TMP_SVG" && ! grep -qi "something went wrong\\|deployment\\|rate limit" "$TMP_SVG"; then
              ok=true
              break
            fi
            echo "Attempt $attempt failed (HTTP ${HTTP_CODE:-curl-error})"
            grep -aA6 'went wrong' "$TMP_SVG" | head -15 || head -c 300 "$TMP_SVG"
            [ "$attempt" = "3" ] || sleep 20
          done
          if $ok; then
            mv "$TMP_SVG" profile/stats.svg
          else
            echo "Failed to render stats.svg; keeping the last-good card"
            rm -f "$TMP_SVG"
          fi

      - name: Generate commit-ranked language card
        run: |
          TMP_SVG=$(mktemp profile/top-langs.svg.XXXXXX)
          if curl -sf --connect-timeout 10 --max-time 60 "https://github-profile-summary-cards.vercel.app/api/cards/most-commit-language?username=kangcodex&theme=tokyonight" > "$TMP_SVG" && python3 .github/scripts/validate-svg.py "$TMP_SVG" && ! grep -qi "error\\|something went wrong\\|deployment\\|rate limit" "$TMP_SVG"; then
            mv "$TMP_SVG" profile/top-langs.svg
          else
            echo "Failed to generate top-langs.svg; keeping the existing card"
            rm -f "$TMP_SVG"
          fi

      - name: Validate SVGs
        run: |
          for f in profile/stats.svg profile/top-langs.svg; do
            if grep -q "Something went wrong" "$f" || grep -qi "DEPLOYMENT" "$f" || grep -qi "rate limit" "$f"; then
              echo "Error content in $f"
              cat "$f"
              exit 1
            fi
            if [ "$f" = "profile/stats.svg" ]; then
              if ! grep -q "<svg" "$f"; then
                echo "Not a valid SVG: $f"
                cat "$f"
                exit 1
              fi
            elif ! python3 .github/scripts/validate-svg.py "$f"; then
              echo "Not a valid SVG: $f"
              cat "$f"
              exit 1
            fi
          done

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/
          git diff --cached --quiet || (git commit -m "Update stats cards" && git push)
