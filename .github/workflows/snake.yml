name: Generate snake

on:
  schedule:
    # Run once a day at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch: # Manual trigger from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push the SVG to the output branch
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate snake.svg and push to output branch
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
          # Commit the SVGs to a branch named 'output'
          commit_message: "chore(snake): regenerate contribution snake"
          branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
