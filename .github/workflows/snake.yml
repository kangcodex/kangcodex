name: Generate snake

on:
  schedule:
    # Run once a day at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch: # Manual trigger from the Actions tab

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push the SVG to the output branch
    steps:
      # Platane/snk@v3 self-contains git operations: it generates the SVG
      # and pushes it to a branch named "output" in the same repo, using
      # GITHUB_TOKEN. No checkout step is needed (and adding one breaks it).
      - name: Generate snake.svg and push to output branch
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
